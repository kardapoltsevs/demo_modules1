jwt:
  secret: my-super-super-long-secret-key-that-is-at-least-32-bytes
  expiration: 600000 # 10 минут

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  redis:
    host: redis
    port: 6379
    timeout: 2000ms
    cache:
      type: redis
      redis:
        time-to-live: 3600000
        cache-null-values: false